---
# Join worker nodes to Kubernetes cluster

- name: Generate Join Command on Master
  hosts: master
  become: true
  vars_files:
    - ../vault/root_password.yaml
  
  tasks:
    - name: Retrieve join command
      shell: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Set join command fact
      set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"

- name: Join Worker Nodes to Cluster
  hosts: workers
  become: true
  vars_files:
    - ../vault/root_password.yaml
  
  pre_tasks:
    - name: Verify master API server is reachable
      wait_for:
        host: "{{ hostvars[groups['master'][0]].ansible_host }}"
        port: 6443
        timeout: 60
      delegate_to: localhost

  tasks:
    - name: Join worker to cluster
      shell: "{{ hostvars[groups['master'][0]].join_command }} >> node_joined.log"
      args:
        chdir: /root
        creates: node_joined.log

  post_tasks:
    - name: Wait for node to be ready
      pause:
        seconds: 10